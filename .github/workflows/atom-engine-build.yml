name: Atom VPN Android Build

on:
  pull_request:
    branches:
      - pow-standalone
    paths:
      - "app/**"
      - "engine/**"
      - "native/**"
      - "vendor/**"
      - "tools/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/atom-engine-build.yml"
  push:
    branches:
      - pow-standalone
      - atom-engine-rename
      - atom-final-cleanup
    paths:
      - "app/**"
      - "engine/**"
      - "native/**"
      - "vendor/**"
      - "tools/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/atom-engine-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atom-vpn-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Atom VPN APK
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install Android build packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"
      - name: Rebuild HEV JNI for Atom package (all four ABIs)
        run: bash tools/build_hev_android.sh
      - name: Build Universal and ARM64 debug APKs
        run: gradle --no-daemon --stacktrace :engine:testDebugUnitTest :app:assembleUniversalDebug :app:assembleArm64Debug
      - name: Validate APK structure, manifest, alignment and signature
        shell: bash
        run: |
          set -euxo pipefail
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          for APK in app/build/outputs/apk/universal/debug/*.apk app/build/outputs/apk/arm64/debug/*.apk; do
            test -s "$APK"
            file "$APK"
            sha256sum "$APK"
            "$TOOLS/aapt" dump badging "$APK"
            "$TOOLS/zipalign" -c -v 4 "$APK"
            "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
            APK="$APK" python3 - <<'PY'
          import os, zipfile
          p = os.environ["APK"]
          with zipfile.ZipFile(p) as z:
              bad = z.testzip()
              assert bad is None, f"Corrupt ZIP entry: {bad}"
              names = z.namelist()
              assert "AndroidManifest.xml" in names
              assert "resources.arsc" in names
              assert any(n.startswith("classes") and n.endswith(".dex") for n in names)
              libs = [n for n in names if n.endswith(".so")]
              print("Validated:", p)
              print("Native libraries:", len(libs))
              required_arm64 = {
                  "lib/arm64-v8a/libaether.so",
                  "lib/arm64-v8a/libaether_jni.so",
                  "lib/arm64-v8a/libhev-socks5-tunnel.so",
              }
              missing = required_arm64.difference(names)
              assert not missing, f"Missing required ARM64 native libraries in {p}: {sorted(missing)}"
              if "/arm64/" in p:
                  assert all("/arm64-v8a/" in n for n in libs), f"Non-ARM64 native library in {p}"
          PY
          done
      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: atom-vpn-universal-apk
          path: app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: atom-vpn-arm64-apk
          path: app/build/outputs/apk/arm64/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: atom-vpn-build-diagnostics
          path: |
            app/build/reports/**
            engine/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
