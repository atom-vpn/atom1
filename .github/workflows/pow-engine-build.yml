name: UAC PoW Engine Build

on:
  push:
    branches:
      - pow-standalone
    paths:
      - "engine/**"
      - "native/**"
      - "vendor/**"
      - "tools/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/pow-engine-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uac-pow-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Android library (AAR)
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout pow-standalone
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"
          yes | sdkmanager --licenses

      - name: Verify required source artifacts
        run: |
          test -f vendor/aars/psiphontunnel-2.0.39.aar
          test -f vendor/aars/libv2ray-native-tun.aar
          test -f vendor/assets/server_entries.txt
          test -f vendor/jniLibs/arm64-v8a/libaether.so
          test -f tools/isolate_psiphon_aar.py
          test -f tools/patch_v2ray_seq.py
          python --version
          gradle --version

      - name: Build release AAR
        run: gradle --no-daemon --stacktrace :engine:assembleRelease

      - name: Upload release AAR
        uses: actions/upload-artifact@v4
        with:
          name: uac-pow-engine-release
          path: engine/build/outputs/aar/engine-release.aar
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uac-pow-build-diagnostics
          path: |
            engine/build/reports/**
            engine/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
