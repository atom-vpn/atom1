name: Atom VPN Android Build

on:
  push:
    branches:
      - pow-standalone
    paths:
      - "app/**"
      - "engine/**"
      - "native/**"
      - "vendor/**"
      - "tools/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/pow-engine-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atom-vpn-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Atom VPN APK
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install Android build packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate APK structure, manifest, alignment and signature
        shell: bash
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"
          "$TOOLS/aapt" dump badging "$APK"
          "$TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > manifest-tree.txt
          sed -n '1,160p' manifest-tree.txt
          "$TOOLS/zipalign" -c -v 4 "$APK"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          python3 - <<'PY'
          import zipfile
          p = "app/build/outputs/apk/debug/app-debug.apk"
          with zipfile.ZipFile(p) as z:
              bad = z.testzip()
              assert bad is None, f"Corrupt ZIP entry: {bad}"
              names = z.namelist()
              assert "AndroidManifest.xml" in names
              assert "resources.arsc" in names
              assert any(n.startswith("classes") and n.endswith(".dex") for n in names)
              print("ZIP entries:", len(names))
              print("DEX files:", sum(n.startswith("classes") and n.endswith(".dex") for n in names))
              print("Native libraries:", sum(n.endswith(".so") for n in names))
          PY
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: atom-vpn-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: atom-vpn-build-diagnostics
          path: |
            app/build/reports/**
            engine/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
